description: A {$DEFINE} inside skipped text has no effect.
source: |
  program P;
  {$IFDEF X} {$DEFINE Y} {$ENDIF}
  {$IFDEF Y} const A = 1; {$ENDIF}
  const A = 2; begin Write(A) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: A
  - EQ
  - INTEGER: 2
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: A
  - RPAREN
  - END
  - DOT
compile: ok
output: "2"

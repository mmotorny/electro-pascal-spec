description: In (*$M 16384,0,688), the ) right after the number doesn't end
  the comment.
source: |
  program P;
  (*$M 16384,0,688) begin Write(1) end. *)
  begin
    Write(2)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - INTEGER: 2
  - RPAREN
  - END
  - DOT
compile: ok
output: "2"

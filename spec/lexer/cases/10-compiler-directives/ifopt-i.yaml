description: "{$IFOPT I+}: I is both a switch and a parameter directive; I/O checking is on by default."
source: |
  program P;
  {$IFOPT I+} const A = 1; {$ENDIF}
  begin Write(A) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: A
  - EQ
  - INTEGER: 1
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: A
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

description: "{$O Foo} while TPC looks for the run-time error address 0000:0000 (/F), with unit Foo compiled first."
options:
  - /F0000:0000
source: |
  {$F+}
  program P;
  uses Overlay, Foo;
  {$O Foo}
  var
    Name: string;
  begin
    Name := ParamStr(0);
    OvrInit(Copy(Name, 1, Length(Name) - 4) + '.OVR');
    Hello
  end.
files:
  FOO.PAS: |
    {$O+,F+}
    unit Foo;
    interface
    procedure Hello;
    implementation
    procedure Hello;
    begin
      Write('hi')
    end;
    end.
precompile:
  - FOO.PAS
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - USES
  - IDENT: OVERLAY
  - COMMA
  - IDENT: FOO
  - SEMI
  - VAR
  - IDENT: NAME
  - COLON
  - STRING
  - SEMI
  - BEGIN
  - IDENT: NAME
  - ASSIGN
  - IDENT: PARAMSTR
  - LPAREN
  - INTEGER: 0
  - RPAREN
  - SEMI
  - IDENT: OVRINIT
  - LPAREN
  - IDENT: COPY
  - LPAREN
  - IDENT: NAME
  - COMMA
  - INTEGER: 1
  - COMMA
  - IDENT: LENGTH
  - LPAREN
  - IDENT: NAME
  - RPAREN
  - MINUS
  - INTEGER: 4
  - RPAREN
  - PLUS
  - STRING: .OVR
  - RPAREN
  - SEMI
  - IDENT: HELLO
  - END
  - DOT
compile:
  error: 117
  message: Target address not found.

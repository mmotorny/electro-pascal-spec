description: After VER70, MSDOS, CPU86, CPU87 and three 63-character
  symbols, the ) right after the name in (*$DEFINE ABCDE) ends the comment.
source: |
  program P;
  {$DEFINE AXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
  {$DEFINE BXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
  {$DEFINE CXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
  (*$DEFINE ABCDE) begin Write(1) end. *)
  begin
    Write(2)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - INTEGER: 1
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

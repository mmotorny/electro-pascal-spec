description: "X and x are the same symbol: {$UNDEF X} also removes x."
source: |
  program P;
  {$DEFINE X} {$DEFINE x} {$UNDEF X}
  {$IFDEF x} const A = 1; {$ENDIF}
  const A = 2; begin Write(A) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: A
  - EQ
  - INTEGER: 2
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: A
  - RPAREN
  - END
  - DOT
compile: ok
output: "2"

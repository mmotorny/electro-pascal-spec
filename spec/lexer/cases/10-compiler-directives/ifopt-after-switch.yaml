description: "{$IFOPT R+} after {$R+}."
source: |
  program P;
  {$R+}
  {$IFOPT R+} const A = 1; {$ENDIF}
  begin Write(A) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: A
  - EQ
  - INTEGER: 1
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: A
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

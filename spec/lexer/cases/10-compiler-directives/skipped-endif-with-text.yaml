description: Text after the name in {$ENDIF junk} is ignored.
source: |
  program P;
  {$IFDEF X} {$ENDIF junk}
  const A = 1; begin Write(A) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: A
  - EQ
  - INTEGER: 1
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: A
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

description: "{$O Foo} for a unit compiled without {$O+}."
options:
  - /M
source: |
  {$F+}
  program P;
  uses Overlay, Foo;
  {$O Foo}
  var Name: string;
  begin
    Name := ParamStr(0);
    OvrInit(Copy(Name, 1, Length(Name) - 4) + '.OVR');
    Hello
  end.
files:
  FOO.PAS: |
    {$F+}
    unit Foo;
    interface
    procedure Hello;
    implementation
    procedure Hello;
    begin
      Write('hi')
    end;
    end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - USES
  - IDENT: OVERLAY
  - COMMA
  - IDENT: FOO
  - SEMI
  - UNIT
  - IDENT: FOO
  - SEMI
  - INTERFACE
  - PROCEDURE
  - IDENT: HELLO
  - SEMI
  - IMPLEMENTATION
  - PROCEDURE
  - IDENT: HELLO
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - STRING: hi
  - RPAREN
  - END
  - SEMI
  - END
  - DOT
compile:
  error: 144
  line: 4
  column: 5
  message: Cannot overlay this unit.

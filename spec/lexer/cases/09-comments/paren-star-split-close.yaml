description: A * at the end of a line and a ) at the start of the next don't
  close a (* comment.
source: |
  program P;
  (* one *
  ) two *) begin Write(1) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - INTEGER: 1
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

description: A Pascal variable named Bx, set to 5, is assigned 7 in an asm
  block as 'Bx'.
source: |
  program P;
  var
    Bx: Integer;
  begin
    Bx := 5;
    asm
      mov ax, 7
      mov Bx, ax
    end;
    Write(Bx)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: BX
  - COLON
  - IDENT: INTEGER
  - SEMI
  - BEGIN
  - IDENT: BX
  - ASSIGN
  - INTEGER: 5
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 7
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: BX
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: BX
  - RPAREN
  - END
  - DOT
compile: ok
output: "5"

description: A Pascal variable named Tbyte, set to 5, is assigned 7 in an
  asm block as 'Tbyte'.
source: |
  program P;
  var
    Tbyte: Integer;
  begin
    Tbyte := 5;
    asm
      mov ax, 7
      mov Tbyte, ax
    end;
    Write(Tbyte)
  end.

description: "'&' and a 32-character Pascal variable's name."
source: |
  program P;
  var
    A2345678901234567890123456789012: Word;
  begin
    A2345678901234567890123456789012 := 0;
    asm
      mov ax, 1
      mov &A2345678901234567890123456789012, ax
    end;
    Write(A2345678901234567890123456789012)
  end.

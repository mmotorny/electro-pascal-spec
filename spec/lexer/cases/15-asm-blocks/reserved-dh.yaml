description: A Pascal variable named Dh, set to 5, is assigned 7 in an asm
  block as 'Dh'.
source: |
  program P;
  var
    Dh: Integer;
  begin
    Dh := 5;
    asm
      mov ax, 7
      mov Dh, ax
    end;
    Write(Dh)
  end.

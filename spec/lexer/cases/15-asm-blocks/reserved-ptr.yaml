description: A Pascal variable named Ptr, set to 5, is assigned 7 in an asm
  block as 'Ptr'.
source: |
  program P;
  var
    Ptr: Integer;
  begin
    Ptr := 5;
    asm
      mov ax, 7
      mov Ptr, ax
    end;
    Write(Ptr)
  end.

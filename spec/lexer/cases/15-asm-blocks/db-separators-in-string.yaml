description: "';', '{' and '(*' inside a string."
source: |
  program P;
  type
    PS = ^String;

  procedure S; assembler;
  asm
    db 4, ';{(*'
  end;

  begin
    Write(PS(@S)^)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - TYPE
  - IDENT: PS
  - EQ
  - CARET
  - STRING
  - SEMI
  - PROCEDURE
  - IDENT: S
  - SEMI
  - IDENT: ASSEMBLER
  - SEMI
  - ASM
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: PS
  - LPAREN
  - AT
  - IDENT: S
  - RPAREN
  - CARET
  - RPAREN
  - END
  - DOT
compile: ok
output: ;{(*

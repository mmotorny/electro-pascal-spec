description: A Pascal variable named Dword, set to 5, is assigned 7 in an
  asm block as 'Dword'.
source: |
  program P;
  var
    Dword: Integer;
  begin
    Dword := 5;
    asm
      mov ax, 7
      mov Dword, ax
    end;
    Write(Dword)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: DWORD
  - COLON
  - IDENT: INTEGER
  - SEMI
  - BEGIN
  - IDENT: DWORD
  - ASSIGN
  - INTEGER: 5
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 7
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: DWORD
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
compile:

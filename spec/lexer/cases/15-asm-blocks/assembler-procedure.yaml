description: The body of an assembler procedure is an asm block too.
source: |
  program P;
  var
    W: Word;

  procedure S; assembler;
  asm
    mov W, 3
  end;

  begin
    S;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - PROCEDURE
  - IDENT: S
  - SEMI
  - IDENT: ASSEMBLER
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: W
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 3
  - ASM_END
  - SEMI
  - BEGIN
  - IDENT: S
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "3"

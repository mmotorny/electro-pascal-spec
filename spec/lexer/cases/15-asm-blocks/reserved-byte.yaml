description: A Pascal variable named Byte, set to 5, is assigned 7 in an asm
  block as 'Byte'.
source: |
  program P;
  var
    Byte: Integer;
  begin
    Byte := 5;
    asm
      mov ax, 7
      mov Byte, ax
    end;
    Write(Byte)
  end.

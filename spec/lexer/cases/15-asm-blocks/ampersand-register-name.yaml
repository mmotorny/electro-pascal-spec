description: "'&AX' names a Pascal variable called AX, while 'ax' is the register."
source: |
  program P;
  var
    AX: Word;
  begin
    AX := 0;
    asm
      mov ax, 5
      mov &AX, ax
    end;
    Write(AX)
  end.

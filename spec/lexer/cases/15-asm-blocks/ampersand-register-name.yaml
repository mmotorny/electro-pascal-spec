  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 5
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: AX
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: AX
  - RPAREN
  - END
  - DOT
compile: ok
output: "5"

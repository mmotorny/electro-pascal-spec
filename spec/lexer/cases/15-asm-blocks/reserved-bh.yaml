description: A Pascal variable named Bh, set to 5, is assigned 7 in an asm
  block as 'Bh'.
source: |
  program P;
  var
    Bh: Integer;
  begin
    Bh := 5;
    asm
      mov ax, 7
      mov Bh, ax
    end;
    Write(Bh)
  end.

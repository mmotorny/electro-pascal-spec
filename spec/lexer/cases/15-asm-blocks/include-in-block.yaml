description: "{$I} between the statements of an asm block."
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      {$I X.INC}
      mov W, ax
    end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
compile:
  error: 118
  line: 7
  column: 15
  message: Include files are not allowed here.

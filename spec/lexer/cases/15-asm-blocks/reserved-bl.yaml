description: A Pascal variable named Bl, set to 5, is assigned 7 in an asm
  block as 'Bl'.
source: |
  program P;
  var
    Bl: Integer;
  begin
    Bl := 5;
    asm
      mov ax, 7
      mov Bl, ax
    end;
    Write(Bl)
  end.

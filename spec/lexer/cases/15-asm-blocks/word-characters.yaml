description: "'$', '&', '?' and '@' join a word: '@@a?$&@b' is one label."
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      jmp @@a?$&@b
      mov ax, 1
      @@a?$&@b: mov ax, 2
      mov W, ax
    end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "2"

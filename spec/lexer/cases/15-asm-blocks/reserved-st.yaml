description: A Pascal variable named St, set to 5, is assigned 7 in an asm
  block as 'St'.
source: |
  program P;
  var
    St: Integer;
  begin
    St := 5;
    asm
      mov ax, 7
      mov St, ax
    end;
    Write(St)
  end.

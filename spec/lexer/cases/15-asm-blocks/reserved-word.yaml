description: A Pascal variable named Word, set to 5, is assigned 7 in an asm
  block as 'Word'.
source: |
  program P;
  var
    Word: Integer;
  begin
    Word := 5;
    asm
      mov ax, 7
      mov Word, ax
    end;
    Write(Word)
  end.

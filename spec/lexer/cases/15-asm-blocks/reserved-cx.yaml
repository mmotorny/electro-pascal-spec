description: A Pascal variable named Cx, set to 5, is assigned 7 in an asm
  block as 'Cx'.
source: |
  program P;
  var
    Cx: Integer;
  begin
    Cx := 5;
    asm
      mov ax, 7
      mov Cx, ax
    end;
    Write(Cx)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: CX
  - COLON
  - IDENT: INTEGER
  - SEMI
  - BEGIN
  - IDENT: CX
  - ASSIGN
  - INTEGER: 5
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 7
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: CX
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: CX
  - RPAREN
  - END
  - DOT
compile: ok
output: "5"

description: The instructions whose names are Pascal reserved words, each as
  the first word of a statement.
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      mov ax, 6
      and ax, 7
      mov bx, 1
      xor dx, dx
      div bx
      mov dx, 0
      in al, dx
      not ax
      or ax, 0
      shl ax, 1
      shr ax, 1
      xor ax, ax
      mov W, 5
    end;
    Write(W)
  end.

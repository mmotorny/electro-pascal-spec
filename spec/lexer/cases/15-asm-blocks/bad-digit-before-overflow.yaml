description: "'429496729A0': the 'A' comes before the value gets too large."
source: |
  program P;
  var
    L: Longint;
  begin
    L := 0;
    asm
      mov word ptr L, (429496729A0) and 0FFFFh
      mov word ptr L+2, (429496729A0) shr 16
    end;
    Write(L)
  end.

description: A Pascal variable named Dl, set to 5, is assigned 7 in an asm
  block as 'Dl'.
source: |
  program P;
  var
    Dl: Integer;
  begin
    Dl := 5;
    asm
      mov ax, 7
      mov Dl, ax
    end;
    Write(Dl)
  end.

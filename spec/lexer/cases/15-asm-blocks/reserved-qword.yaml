description: A Pascal variable named Qword, set to 5, is assigned 7 in an
  asm block as 'Qword'.
source: |
  program P;
  var
    Qword: Integer;
  begin
    Qword := 5;
    asm
      mov ax, 7
      mov Qword, ax
    end;
    Write(Qword)
  end.

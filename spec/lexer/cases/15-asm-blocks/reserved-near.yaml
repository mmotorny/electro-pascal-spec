description: A Pascal variable named Near, set to 5, is assigned 7 in an asm
  block as 'Near'.
source: |
  program P;
  var
    Near: Integer;
  begin
    Near := 5;
    asm
      mov ax, 7
      mov Near, ax
    end;
    Write(Near)
  end.

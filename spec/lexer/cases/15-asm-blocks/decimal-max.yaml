description: 4294967295 as a 32-bit value.
source: |
  program P;
  var
    L: Longint;
  begin
    L := 0;
    asm
      mov word ptr L, (4294967295) and 0FFFFh
      mov word ptr L+2, (4294967295) shr 16
    end;
    Write(L)
  end.

description: An instruction name after the first word of a statement names a
  Pascal variable.
source: |
  program P;
  var
    Mov: Word;
  begin
    Mov := 0;
    asm
      mov ax, 7
      mov Mov, ax
    end;
    Write(Mov)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: MOV
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: MOV
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 7
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: MOV
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: MOV
  - RPAREN
  - END
  - DOT
compile: ok
output: "7"

description: "'end' after a label on the same line ends the block."
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      mov ax, 6
      mov W, ax
      @@x: end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 6
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: W
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - ASM_WORD: "@@X"
  - ASM_SYMBOL: ":"
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "6"

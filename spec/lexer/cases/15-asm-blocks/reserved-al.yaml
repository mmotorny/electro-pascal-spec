description: A Pascal variable named Al, set to 5, is assigned 7 in an asm
  block as 'Al'.
source: |
  program P;
  var
    Al: Integer;
  begin
    Al := 5;
    asm
      mov ax, 7
      mov Al, ax
    end;
    Write(Al)
  end.

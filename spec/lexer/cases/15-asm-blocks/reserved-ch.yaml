description: A Pascal variable named Ch, set to 5, is assigned 7 in an asm
  block as 'Ch'.
source: |
  program P;
  var
    Ch: Integer;
  begin
    Ch := 5;
    asm
      mov ax, 7
      mov Ch, ax
    end;
    Write(Ch)
  end.

description: A Pascal variable named Cl, set to 5, is assigned 7 in an asm
  block as 'Cl'.
source: |
  program P;
  var
    Cl: Integer;
  begin
    Cl := 5;
    asm
      mov ax, 7
      mov Cl, ax
    end;
    Write(Cl)
  end.

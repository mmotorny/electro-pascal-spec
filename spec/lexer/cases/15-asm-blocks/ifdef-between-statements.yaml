description: Conditional directives between statements select which
  statements are assembled.
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      {$IFDEF X}
      mov ax, 1
      {$ELSE}
      mov ax, 2
      {$ENDIF}
      mov W, ax
    end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 2
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: W
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "2"

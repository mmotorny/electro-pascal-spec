description: Every prefix, each followed by nop, then an unknown identifier
  so that the program doesn't compile and isn't run.
source: |
  program P;
  begin
    asm
      lock nop
      rep nop
      repe nop
      repne nop
      repnz nop
      repz nop
      segcs nop
      segds nop
      seges nop
      segss nop
      mov ax, Unknown
    end;
  end.

description: A four-character string as a 32-bit number.
source: |
  program P;
  var
    L: Longint;
  begin
    L := 0;
    asm
      mov word ptr L, ('ABCD') and 0FFFFh
      mov word ptr L+2, ('ABCD') shr 16
    end;
    Write(L)
  end.

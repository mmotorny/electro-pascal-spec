description: "A 32-character number: 31 zeros and a 1."
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      mov ax, 00000000000000000000000000000001
      mov W, ax
    end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "1"

description: "A string after db gives all its characters: the procedure's bytes are a string the program prints."
source: |
  program P;
  type
    PS = ^String;

  procedure S; assembler;
  asm
    db 5, 'Hello'
  end;

  begin
    Write(PS(@S)^)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - TYPE
  - IDENT: PS
  - EQ
  - CARET
  - STRING
  - SEMI
  - PROCEDURE
  - IDENT: S
  - SEMI
  - IDENT: ASSEMBLER
  - SEMI
  - ASM
  - ASM_INSTRUCTION: DB
  - ASM_NUMBER: 5
  - ASM_SYMBOL: ","
  - ASM_STRING: Hello
  - ASM_END
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: PS
  - LPAREN
  - AT
  - IDENT: S
  - RPAREN
  - CARET
  - RPAREN
  - END
  - DOT
compile: ok
output: Hello

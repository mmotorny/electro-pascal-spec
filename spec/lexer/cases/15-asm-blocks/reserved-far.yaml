description: A Pascal variable named Far, set to 5, is assigned 7 in an asm
  block as 'Far'.
source: |
  program P;
  var
    Far: Integer;
  begin
    Far := 5;
    asm
      mov ax, 7
      mov Far, ax
    end;
    Write(Far)
  end.

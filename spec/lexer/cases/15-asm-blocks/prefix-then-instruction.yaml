description: After a prefix, the next word is an instruction.
source: |
  program P;
  var
    W: Word;
  begin
    W := 0;
    asm
      xor cx, cx
      rep stosb
      mov ax, 3
      mov W, ax
    end;
    Write(W)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - VAR
  - IDENT: W
  - COLON
  - IDENT: WORD
  - SEMI
  - BEGIN
  - IDENT: W
  - ASSIGN
  - INTEGER: 0
  - SEMI
  - ASM
  - ASM_INSTRUCTION: XOR
  - ASM_RESERVED: CX
  - ASM_SYMBOL: ","
  - ASM_RESERVED: CX
  - ASM_END
  - ASM_INSTRUCTION: REP
  - ASM_INSTRUCTION: STOSB
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_RESERVED: AX
  - ASM_SYMBOL: ","
  - ASM_NUMBER: 3
  - ASM_END
  - ASM_INSTRUCTION: MOV
  - ASM_IDENT: W
  - ASM_SYMBOL: ","
  - ASM_RESERVED: AX
  - ASM_END
  - SEMI
  - IDENT: WRITE
  - LPAREN
  - IDENT: W
  - RPAREN
  - END
  - DOT
compile: ok
output: "3"

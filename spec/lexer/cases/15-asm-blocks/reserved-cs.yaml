description: A Pascal variable named Cs, set to 5, is assigned 7 in an asm
  block as 'Cs'.
source: |
  program P;
  var
    Cs: Integer;
  begin
    Cs := 5;
    asm
      mov ax, 7
      mov Cs, ax
    end;
    Write(Cs)
  end.

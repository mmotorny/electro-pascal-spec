description: 0FFFFFFFFh as a 32-bit value.
source: |
  program P;
  var
    L: Longint;
  begin
    L := 0;
    asm
      mov word ptr L, (0FFFFFFFFh) and 0FFFFh
      mov word ptr L+2, (0FFFFFFFFh) shr 16
    end;
    Write(L)
  end.

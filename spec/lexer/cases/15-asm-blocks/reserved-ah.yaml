description: A Pascal variable named Ah, set to 5, is assigned 7 in an asm
  block as 'Ah'.
source: |
  program P;
  var
    Ah: Integer;
  begin
    Ah := 5;
    asm
      mov ax, 7
      mov Ah, ax
    end;
    Write(Ah)
  end.

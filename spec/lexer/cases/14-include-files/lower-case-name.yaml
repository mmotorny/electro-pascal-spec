description: "The name is read in upper case: {$I defs.inc} reads DEFS.INC."
source: |
  program P;
  {$I defs.inc}
  begin
    Write(C)
  end.
files:
  DEFS.INC: |
    const C = 7;
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: C
  - EQ
  - INTEGER: 7
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: C
  - RPAREN
  - END
  - DOT
compile: ok
output: "7"

description: "#255 is the largest character code."
source: |
  program P;
  const S = #255;
  begin
    Write(S)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: S
  - EQ
  - STRING: "\xff"
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: S
  - RPAREN
  - END
  - DOT
compile: ok
output: "\xff"

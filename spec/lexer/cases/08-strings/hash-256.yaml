description: "#256 is accepted; the output shows which character it is."
source: |
  program P;
  const S = #256;
  begin
    Write(S)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: S
  - EQ
  - STRING: "\0"
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: S
  - RPAREN
  - END
  - DOT
compile: ok
output: "\0"

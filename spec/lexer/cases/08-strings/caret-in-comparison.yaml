  - SEMI
  - BEGIN
  - IDENT: C
  - ASSIGN
  - STRING: "\t"
  - SEMI
  - IF
  - IDENT: C
  - EQ
  - STRING: "\t"
  - THEN
  - IDENT: WRITE
  - LPAREN
  - STRING: y

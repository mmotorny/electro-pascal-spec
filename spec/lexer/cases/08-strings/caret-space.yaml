description: "^ takes the next character even when it's a blank: ^ followed by a space is character 96 (`), and M is then an identifier."
source: |
  program P;
  const S = ^ M;
  begin
    Write(S)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: S
  - EQ
  - STRING: "`"
  - IDENT: M
compile:
  error: 85
  line: 2
  column: 13
  message: "\";\" expected."

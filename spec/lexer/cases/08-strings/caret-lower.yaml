description: ^m in lower case is the same as ^M.
source: |
  program P; const S = ^m; begin Write(S) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: S
  - EQ
  - STRING: "\r"
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: S
  - RPAREN
  - END
  - DOT
compile: ok
output: "\r"

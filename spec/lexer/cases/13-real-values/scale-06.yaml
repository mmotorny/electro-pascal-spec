description: The same 7 digits scaled by 10^-6. The output is the constant's
  80-bit Extended value in hex, most significant byte first.
source: |
  {$N+,E-}
  program P;
  const C = 1234567e-6;
  const H: array[0..15] of Char = '0123456789ABCDEF';
  var X: Extended; B: array[0..9] of Byte absolute X; I: Integer;
  begin X := C; for I := 9 downto 0 do Write(H[B[I] shr 4], H[B[I] and 15]) end.

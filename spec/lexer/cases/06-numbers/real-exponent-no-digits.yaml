description: "An exponent may have no digits: 1e is a real, and the exponent counts as 0."
source: |
  program P; const C = 1e; begin Write(C) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: C
  - EQ
  - REAL: 1e
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: C
  - RPAREN
  - END
  - DOT
compile: ok
output: " 1.0000000000E+00"

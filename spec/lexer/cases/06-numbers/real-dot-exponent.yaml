description: "A dot may be followed directly by an exponent: 1.e5 is a real."
source: |
  program P;
  const C = 1.e5;
  begin
    Write(C)
  end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: C
  - EQ
  - REAL: "1.e5"
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: C
  - RPAREN
  - END
  - DOT
compile: ok
output: " 1.0000000000E+05"

description: Leading zeros in a hex number don't count against the range.
source: |
  program P; const C = $000000000FF; begin Write(C) end.
tokens:
  - PROGRAM
  - IDENT: P
  - SEMI
  - CONST
  - IDENT: C
  - EQ
  - INTEGER: 255
  - SEMI
  - BEGIN
  - IDENT: WRITE
  - LPAREN
  - IDENT: C
  - RPAREN
  - END
  - DOT
compile: ok
output: "255"

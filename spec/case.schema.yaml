$schema: https://json-schema.org/draft/2020-12/schema
title: Spec test case
description: 'One case of the spec: a YAML file holding this mapping. Strings that
  stand for bytes (source, output, STRING values) hold one character per byte, U+0000
  to U+00FF.'
type: object
additionalProperties: false
dependentRequired:
  precompile:
    - files
required:
  - description
  - source
  - tokens
  - compile
properties:
  description:
    description: What the input is and what it shows.
    type: string
    minLength: 1
  options:
    description: Options for TPC's command line, such as /M or /DNAME, given
      before the program's name.
    type: array
    minItems: 1
    items:
      type: string
      pattern: ^[/-][A-Za-z0-9$_.:;=+,\\-]*$
  source:
    description: The program, byte for byte.
    $ref: '#/$defs/bytes'
  files:
    description: More files beside the program, such as include files, from
      their DOS names to their contents, byte for byte.
    type: object
    minProperties: 1
    propertyNames:
      pattern: ^[A-Z0-9_]{1,8}(\.[A-Z0-9_]{1,3})?$
    additionalProperties:
      $ref: '#/$defs/bytes'
  precompile:
    description: Names of files among files that TPC compiles, in this order
      and with no options, before the program, such as units the program
      needs compiled already.
    type: array
    minItems: 1
    items:
      type: string
      pattern: ^[A-Z0-9_]{1,8}(\.[A-Z0-9_]{1,3})?$
  fpu:
    description: false when TPC compiles the program, and the files it
      compiles first, as on a machine without a floating-point unit. The
      compiled program still runs on the reference machine.
    const: false
  tokens:
    description: The tokens TPC reads, in order, up to the end of the
      program or up to the token where TPC reports an error. A token is its kind
      alone, or a mapping from its kind to its value.
    type: array
    items:
      $ref: '#/$defs/token'
  compile:
    description: 'What compiling the source with TPC gives: ok; hang, when TPC
      never finishes compiling it; or the error with
      its position when TPC gives one (1-based), the file it is in when that
      isn''t the program, and TPC''s message.'
    oneOf:
      - const: ok
      - const: hang
      - type: object
        additionalProperties: false
        required:
          - error
          - message
        dependentRequired:
          line:
            - column
          column:
            - line
        properties:
          error:
            type: integer
            minimum: 1
          line:
            type: integer
            minimum: 1
          column:
            type: integer
            minimum: 1
          file:
            description: The file the error is in, when it isn't the program.
            type: string
          message:
            description: TPC's error message.
            type: string
  output:
    description: What the compiled program writes to standard output. Present exactly
      when compile is ok.
    $ref: '#/$defs/bytes'
if:
  properties:
    compile:
      const: ok
then:
  required:
    - output
else:
  not:
    required:
      - output
$defs:
  bytes:
    type: string
    pattern: ^[\u0000-\u00ff]*$
  token:
    oneOf:
      - description: A reserved word or a special symbol.
        enum: [
            # Reserved words
            AND, ARRAY, ASM, BEGIN, CASE, CONST, CONSTRUCTOR, DESTRUCTOR,
            DIV, DO, DOWNTO, ELSE, END, FILE, FOR, FUNCTION, GOTO, IF,
            IMPLEMENTATION, IN, INHERITED, INLINE, INTERFACE, LABEL, MOD,
            NIL, NOT, OBJECT, OF, OR, PACKED, PROCEDURE, PROGRAM, RECORD,
            REPEAT, SET, SHL, SHR, STRING, THEN, TO, TYPE, UNIT, UNTIL,
            USES, VAR, WHILE, WITH, XOR,
            # Special symbols
            PLUS, MINUS, STAR, SLASH, EQ, NE, LT, LE, GT, GE, LPAREN,
            RPAREN, LBRACKET, RBRACKET, DOT, DOTDOT, COMMA, COLON, SEMI,
            ASSIGN, CARET, AT,
            # The end of a statement in an asm block
            ASM_END
          ]
      - description: 'An identifier: its first 63 characters, in upper case.'
        type: object
        additionalProperties: false
        required:
          - IDENT
        properties:
          IDENT:
            type: string
            pattern: ^[A-Z_][A-Z0-9_]{0,62}$
      - description: 'An integer number: its value as a signed 32-bit integer.'
        type: object
        additionalProperties: false
        required:
          - INTEGER
        properties:
          INTEGER:
            type: integer
            minimum: -2147483648
            maximum: 2147483647
      - description: A real number, as written.
        type: object
        additionalProperties: false
        required:
          - REAL
        properties:
          REAL:
            type: string
            pattern: ^[0-9]+(\.[0-9]*)?([eE][-+]?[0-9]*)?$
      - description: 'A character string: its characters.'
        type: object
        additionalProperties: false
        required:
          - STRING
        properties:
          STRING:
            $ref: '#/$defs/bytes'
      - description: 'A word in an asm block: the first 32 characters of an
          instruction, a reserved word, a Pascal identifier (without its &), or
          a first word that is not an instruction; in upper case.'
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        patternProperties:
          ^ASM_(INSTRUCTION|RESERVED|IDENT|WORD)$:
            type: string
            pattern: ^[A-Z0-9_@$&?]{1,32}$
      - description: 'A number in an asm block: its value.'
        type: object
        additionalProperties: false
        required:
          - ASM_NUMBER
        properties:
          ASM_NUMBER:
            type: integer
            minimum: 0
            maximum: 4294967295
      - description: 'A string in an asm block: its characters.'
        type: object
        additionalProperties: false
        required:
          - ASM_STRING
        properties:
          ASM_STRING:
            $ref: '#/$defs/bytes'
      - description: 'A symbol in an asm block: its character.'
        type: object
        additionalProperties: false
        required:
          - ASM_SYMBOL
        properties:
          ASM_SYMBOL:
            type: string
            pattern: ^[\u0000-\u00ff]$
